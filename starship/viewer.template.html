<title>Tile Starship Blockout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed 3D stage; a title plate top-left, one control dock along the bottom. */
:root {
  --bg: #e9ecf1; --stage-hi: #f7f8fb; --fg: #161a22; --muted: #5b6474;
  --panel: rgba(255,255,255,.82); --line: #c5ccd8; --accent: #d6336c; --on-accent: #ffffff;
  --grid: #b9c1cf; --clay: #9aa3b2;
  --display: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131a; --stage-hi: #1b2130; --fg: #eef1f6; --muted: #98a2b5;
  --panel: rgba(22,27,38,.82); --line: #343c4d; --accent: #ff6fa3; --on-accent: #1a0710;
  --grid: #39425a; --clay: #7d879a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10131a; --stage-hi: #1b2130; --fg: #eef1f6; --muted: #98a2b5;
  --panel: rgba(22,27,38,.82); --line: #343c4d; --accent: #ff6fa3; --on-accent: #1a0710;
  --grid: #39425a; --clay: #7d879a; color-scheme: dark }

html, body { height: 100%; }
body { background: radial-gradient(120% 90% at 50% 35%, var(--stage-hi), var(--bg)); background-color: var(--bg);
  color: var(--fg); font-family: var(--mono); font-size: 13px; overflow: hidden; }
#stage { position: relative; height: 100%; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.plate { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
.plate h1 { margin: 0; font: 700 clamp(20px, 3.4vw, 30px)/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.plate p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.plate b { color: var(--fg); font-weight: 500; }

.dock { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; pointer-events: none; }
.group { pointer-events: auto; display: flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; backdrop-filter: blur(8px); }
.group span { padding: 0 8px 0 7px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.group button { font: 500 12.5px var(--mono); color: var(--fg); background: none; border: 0; border-radius: 6px;
  padding: 7px 10px; cursor: pointer; }
.group button:hover { background: color-mix(in srgb, var(--fg) 9%, transparent); }
.group button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 520px) {
  .group span { display: none; }
  .group button { padding: 9px 9px; }
  .plate p { font-size: 11.5px; }
}
</style>

<div id="stage">
  <div class="plate">
    <h1>Tile Starship Blockout</h1>
    <p><b id="count">–</b> tiles · <b id="size">–</b> tile edges (L × W × H) · grid square = 1 tile edge<br>drag to orbit · pinch or scroll to zoom</p>
  </div>
  <div class="dock">
    <div class="group" role="group" aria-label="Surface">
      <span>Surface</span>
      <button id="mode-frames" data-mode="frames" aria-pressed="true">Frames</button>
      <button id="mode-panels" data-mode="panels" aria-pressed="false">Panels</button>
      <button id="mode-clay" data-mode="clay" aria-pressed="false">Clay</button>
    </div>
    <div class="group" role="group" aria-label="Camera">
      <span>View</span>
      <button id="view-wing" data-view="wing">Wing</button>
      <button id="view-dome" data-view="dome">Dome</button>
      <button id="view-nose" data-view="nose">Nose</button>
      <button id="view-tail" data-view="tail">Tail</button>
      <button id="view-top" data-view="top">Top</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const stage = document.getElementById('stage');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // --- small vector kit (plain arrays, Y-up) so the page works with or without WebGL
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const unit = (a) => mul(a, 1 / Math.hypot(a[0], a[1], a[2]));
  const V = (p) => [p[0], p[2], -p[1]];                     // build space is Z-up

  // --- tile mesher: open frame or solid plate from a planar outline, as outward-wound polygons
  function meshTile(tile, solid) {
    const pts = tile.p.map(V), m = pts.length;
    let n = [0, 0, 0];
    for (let i = 0; i < m; i++) n = add(n, cross(pts[i], pts[(i + 1) % m]));
    n = unit(n);
    const h = mul(n, DATA.thick / 2), up = (a) => add(a, h), dn = (a) => sub(a, h), polys = [];
    const inner = pts.map((p, i) => {
      const n1 = cross(n, unit(sub(p, pts[(i + m - 1) % m]))), n2 = cross(n, unit(sub(pts[(i + 1) % m], p)));
      return add(p, mul(add(n1, n2), DATA.bar / (1 + dot(n1, n2))));
    });
    if (solid) { polys.push(pts.map(up)); polys.push(pts.map(dn).reverse()); }
    for (let i = 0; i < m; i++) {
      const j = (i + 1) % m;
      polys.push([dn(pts[i]), dn(pts[j]), up(pts[j]), up(pts[i])]);
      if (!solid) {
        polys.push([up(pts[i]), up(pts[j]), up(inner[j]), up(inner[i])]);
        polys.push([dn(pts[j]), dn(pts[i]), dn(inner[i]), dn(inner[j])]);
        polys.push([dn(inner[j]), dn(inner[i]), up(inner[i]), up(inner[j])]);
      }
    }
    return polys;
  }
  const tiles = DATA.tiles.map((t) => ({ c: t.c, frames: meshTile(t, false), panels: meshTile(t, true) }));

  // --- orbit camera shared by both renderers
  const target = V([-0.25, -0.1, 1.05]);
  const cam = { az: 0, el: 0.4, dist: 9, fov: 36 };
  const camPos = () => add(target, mul([Math.cos(cam.el) * Math.sin(cam.az), Math.sin(cam.el), Math.cos(cam.el) * Math.cos(cam.az)], cam.dist));
  let mode = 'frames', W = 1, H = 1, dirty = false, fly = null;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  // --- renderer A: WebGL through three.js
  function makeGL() {
    if (!window.THREE) return null;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { return null; }
    renderer.setPixelRatio(DPR);
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8fa0, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(4, 9, 6); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(-6, 3, -5); scene.add(rim);
    const geo = (polys) => {
      const a = [];
      polys.forEach((p) => { for (let i = 1; i < p.length - 1; i++) a.push(...p[0], ...p[i], ...p[i + 1]); });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(a, 3)); g.computeVertexNormals(); return g;
    };
    const opt = { roughness: 0.35, side: THREE.DoubleSide, flatShading: true };
    const mats = {}, clay = new THREE.MeshStandardMaterial(Object.assign({}, opt, { roughness: 0.8 }));
    for (const k in DATA.colors) mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: DATA.colors[k] }, opt));
    const parts = tiles.map((t) => { const m = new THREE.Mesh(undefined, mats[t.c]); m.userData = { c: t.c, frames: geo(t.frames), panels: geo(t.panels) }; scene.add(m); return m; });
    let grid;
    return {
      el: renderer.domElement,
      theme() {
        if (grid) scene.remove(grid);
        grid = new THREE.GridHelper(12, 12, css('--grid'), css('--grid'));
        grid.material.transparent = true; grid.material.opacity = 0.55; grid.position.y = -0.001; scene.add(grid);
        clay.color.set(css('--clay'));
      },
      mode() { parts.forEach((m) => { m.geometry = mode === 'frames' ? m.userData.frames : m.userData.panels; m.material = mode === 'clay' ? clay : mats[m.userData.c]; }); },
      size() { renderer.setSize(W, H, false); camera.aspect = W / H; },
      draw() { camera.fov = cam.fov; camera.updateProjectionMatrix(); camera.position.fromArray(camPos()); camera.lookAt(target[0], target[1], target[2]); renderer.render(scene, camera); }
    };
  }

  // --- renderer B: depth-sorted 2D canvas, used when WebGL or the library is unavailable
  function make2D() {
    const el = document.createElement('canvas'), ctx = el.getContext('2d');
    const rgb = (hex) => { const c = document.createElement('canvas').getContext('2d'); c.fillStyle = hex; const s = c.fillStyle; return [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)); };
    const cols = {}; for (const k in DATA.colors) cols[k] = rgb(DATA.colors[k]);
    let clay = [150, 160, 175], gridCol = '#bbb';
    const light = unit([4, 9, 6]);
    return {
      el,
      theme() { clay = rgb(css('--clay')); gridCol = css('--grid'); },
      mode() {},
      size() { el.width = W * DPR; el.height = H * DPR; },
      draw() {
        const pos = camPos(), f = unit(sub(target, pos)), r = unit(cross(f, [0, 1, 0])), u = cross(r, f);
        const F = (H / 2) / Math.tan(cam.fov * Math.PI / 360);
        const proj = (p) => { const d = sub(p, pos), z = dot(d, f); return z < 0.2 ? null : [W / 2 + dot(d, r) / z * F, H / 2 - dot(d, u) / z * F]; };
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = gridCol; ctx.globalAlpha = 0.55; ctx.lineWidth = 1; ctx.beginPath();
        for (let i = -6; i <= 6; i++) [[[i, 0, -6], [i, 0, 6]], [[-6, 0, i], [6, 0, i]]].forEach(([a, b]) => { const A = proj(a), B = proj(b); if (A && B) { ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); } });
        ctx.stroke(); ctx.globalAlpha = 1;
        const list = [];
        tiles.forEach((t) => (mode === 'frames' ? t.frames : t.panels).forEach((p) => {
          let c = [0, 0, 0]; p.forEach((v) => { c = add(c, v); }); c = mul(c, 1 / p.length);
          let n = unit(cross(sub(p[1], p[0]), sub(p[2], p[0])));
          if (dot(n, sub(pos, c)) < 0) n = mul(n, -1);
          list.push({ p, d: dot(sub(c, pos), f), k: 0.58 + 0.42 * Math.max(0, dot(n, light)), col: mode === 'clay' ? clay : cols[t.c] });
        }));
        list.sort((a, b) => b.d - a.d);
        ctx.lineJoin = 'round'; ctx.lineWidth = 0.6;
        list.forEach((q) => {
          const s = q.p.map(proj); if (s.some((x) => !x)) return;
          ctx.beginPath(); s.forEach((x, i) => (i ? ctx.lineTo(x[0], x[1]) : ctx.moveTo(x[0], x[1]))); ctx.closePath();
          ctx.fillStyle = ctx.strokeStyle = 'rgb(' + q.col.map((v) => Math.round(v * q.k)).join(',') + ')'; ctx.fill(); ctx.stroke();
        });
      }
    };
  }

  const R = makeGL() || make2D();
  stage.prepend(R.el);
  function invalidate() { if (dirty) return; dirty = true; requestAnimationFrame(frame); }
  function frame(now) {
    dirty = false;
    if (fly) {
      const k = Math.min(1, (now - fly.t0) / 650), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      ['az', 'el', 'dist'].forEach((a) => { cam[a] = fly.from[a] + (fly.to[a] - fly.from[a]) * e; });
      if (k >= 1) fly = null; else invalidate();
    }
    R.draw();
  }

  function setMode(m) {
    mode = m; R.mode();
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    invalidate();
  }
  // Camera stations, as offsets from the target in build space (x nose->tail, y dome->wing, z up).
  const VIEWS = { wing: [1.6, 7.6, 3.4], dome: [-1.2, -8.2, 2.0], nose: [-7.6, -2.6, 2.9], tail: [6.0, -5.6, 1.6], top: [0.01, -1.2, 10.5], home: [-5.2, -6.4, 4.4] };
  function setView(name, instant) {
    const o = V(VIEWS[name]), dist = Math.hypot(o[0], o[1], o[2]);
    const to = { az: Math.atan2(o[0], o[2]), el: Math.asin(o[1] / dist), dist };
    if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(cam, to); fly = null; }
    else {
      to.az = cam.az + Math.atan2(Math.sin(to.az - cam.az), Math.cos(to.az - cam.az));
      fly = { from: { az: cam.az, el: cam.el, dist: cam.dist }, to, t0: performance.now() };
    }
    invalidate();
  }

  // --- touch, pen and mouse: one pointer orbits, two pinch; wheel zooms
  const ptrs = new Map(); let pinch = 0;
  const clampCam = () => { cam.el = Math.max(-0.05, Math.min(1.5, cam.el)); cam.dist = Math.max(3, Math.min(22, cam.dist)); };
  const spread = () => { const a = [...ptrs.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
  R.el.addEventListener('pointerdown', (e) => { try { R.el.setPointerCapture(e.pointerId); } catch (_) {} ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) pinch = spread(); fly = null; });
  R.el.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { cam.az -= dx * 0.008; cam.el += dy * 0.008; }
    else if (ptrs.size === 2) { const s = spread(); if (pinch > 0 && s > 0) cam.dist *= pinch / s; pinch = s; }
    clampCam(); invalidate();
  });
  const lift = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  R.el.addEventListener('pointerup', lift); R.el.addEventListener('pointercancel', lift);
  R.el.addEventListener('wheel', (e) => { e.preventDefault(); fly = null; cam.dist *= Math.exp(e.deltaY * 0.0012); clampCam(); invalidate(); }, { passive: false });

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight; if (!W || !H) return;
    cam.fov = W < H ? 54 : 36; R.size(); R.draw();
  }
  function theme() { R.theme(); invalidate(); }
  new ResizeObserver(resize).observe(stage);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

  const all = DATA.tiles.flatMap((t) => t.p), span = (i) => (Math.max(...all.map((p) => p[i])) - Math.min(...all.map((p) => p[i]))).toFixed(1);
  document.getElementById('count').textContent = DATA.tiles.length;
  document.getElementById('size').textContent = [span(0), span(1), span(2)].join(' × ');

  R.theme(); setMode('frames'); setView('home', true); resize();
  window.tileShip = { setMode, setView, renderer: window.THREE && R.el.getContext('2d') === null ? 'webgl' : '2d' };
})();
</script>
